<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SCP-Book 架构思维导图</title>
<style>
  * { margin: 0; padding: 0; }
  body { background: #fafafa; overflow: hidden; }
  #mindmap { width: 100vw; height: 100vh; }
  svg { width: 100%; height: 100%; }
  .info-bar {
    position: fixed; bottom: 12px; right: 16px;
    font-size: 12px; color: #999; font-family: sans-serif;
  }
</style>
</head>
<body>
<svg id="mindmap"></svg>
<div class="info-bar">🖱 滚轮缩放 | 拖拽平移 | 点击节点折叠/展开</div>

<!-- markmap 依赖 -->
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script src="https://cdn.jsdelivr.net/npm/markmap-view@0.15"></script>
<script src="https://cdn.jsdelivr.net/npm/markmap-lib@0.15"></script>

<script>
(async () => {
  // 加载 architecture.md
  const md = await fetch('architecture.md').then(r => r.text());

  // 用 markmap-lib 把 markdown 转成思维导图数据
  const { Transformer } = window.markmap;
  const transformer = new Transformer();
  const { root } = transformer.transform(md);

  // 用 markmap-view 渲染
  const { Markmap } = window.markmap;
  Markmap.create('#mindmap', {
    autoFit: true,
    colorFreezeLevel: 2,
    duration: 400,
    maxWidth: 280,
  }, root);
})();
</script>
</body>
</html>
